apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  # ClusterIP for now - frontend needs a real externally-reachable URL for this
  # eventually (VITE_API_BASE_URL, baked in at frontend build time, since the
  # browser calls it directly, not the frontend pod). Swap this to a
  # LoadBalancer/Ingress once the exposure method is decided.
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
