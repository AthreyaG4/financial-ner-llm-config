apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: ClusterSecretStore
  target:
    # Generates a real K8s Secret named "backend-secrets" - the exact name
    # backend/values.yaml's envFrom.secretRef already expects. Replaces
    # the old manual `kubectl create secret --from-env-file` step entirely.
    name: {{ .Values.backendSecret.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Store the backend's full env as one JSON secret in Secrets
        # Manager under this key.
        key: {{ .Values.global.projectName }}/{{ .Values.backendSecret.secretsManagerKey }}
