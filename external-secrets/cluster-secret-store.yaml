apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      # Must match Infra Repo's var.aws_region.
      region: eu-west-1
      # No explicit `auth` block - ESO's own pod already has IRSA
      # credentials (its ServiceAccount is annotated with the eso IAM
      # role's ARN, see eso-application.yaml), and the provider uses those
      # directly by default rather than assuming a further role.
