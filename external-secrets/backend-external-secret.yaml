apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: financial-ner-llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    # Generates a real K8s Secret named "backend-secrets" - the exact name
    # backend/deployment.yaml's envFrom.secretRef already expects. Replaces
    # the old manual `kubectl create secret --from-env-file` step entirely.
    name: backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Store the backend's full env as one JSON secret in Secrets
        # Manager under this key - matches the eso IAM policy's resource
        # scope (financial-ner-llm/*) in Infra Repo's irsa.tf.
        key: financial-ner-llm/backend
