apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  # ClusterIP - internal only. Nothing outside the cluster calls this
  # directly; backend would reach it via in-cluster DNS (vllm.<namespace>.
  # svc.cluster.local) once it's actually wired to use it.
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
