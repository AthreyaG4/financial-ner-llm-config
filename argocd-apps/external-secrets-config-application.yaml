apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    # Wave 1 - must sync after the eso Application (wave 0) has actually
    # installed the ExternalSecret/ClusterSecretStore CRDs, or applying
    # these custom resources fails with "no matches for kind".
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/AthreyaG4/financial-ner-llm-config.git
      targetRevision: main
      path: external-secrets
      helm:
        valueFiles:
          - $values/global-values.yaml
    - repoURL: https://github.com/AthreyaG4/financial-ner-llm-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: financial-ner-llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
