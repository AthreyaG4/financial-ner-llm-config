apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress
  # This is the namespace ArgoCD itself lives in - NOT where the app gets
  # deployed (that's spec.destination.namespace below).
  namespace: argocd
  annotations:
    # Wave 3 - deliberately isolated after the eso(0)/external-secrets-
    # config(1)/backend(2) chain, not because ingress depends on them, but
    # the reverse: ingress's health depends on the ALB actually finishing
    # provisioning, which can take a while. If it shared wave 0 with eso,
    # a slow/stuck ALB would block external-secrets-config and backend
    # from ever getting their turn, since root-app waits for a whole wave
    # to be Healthy before starting the next one.
    argocd.argoproj.io/sync-wave: "3"
  # Without this, `kubectl delete application ingress` only removes ArgoCD's
  # tracking of it - the actual Ingress object (and therefore the ALB the
  # AWS Load Balancer Controller created for it) would be left behind,
  # orphaned. With it, deleting the Application blocks until the Ingress
  # itself is pruned, which is what the Makefile's `destroy` target relies
  # on to guarantee the ALB is gone before terraform destroy ever runs -
  # otherwise it races an ALB still holding ENIs in the VPC's subnets.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/AthreyaG4/financial-ner-llm-config.git
      targetRevision: main
      path: ingress
      helm:
        valueFiles:
          - $values/global-values.yaml
    - repoURL: https://github.com/AthreyaG4/financial-ner-llm-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: financial-ner-llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
