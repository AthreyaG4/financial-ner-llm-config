apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.5.0
    helm:
      values: |
        # Must exactly match the EKS cluster's real name - same gotcha as
        # the kubernetes.io/cluster/* subnet tags in Infra Repo's
        # subnets.tf. The controller uses this to filter which subnets/
        # resources belong to it.
        clusterName: financial-ner-llm
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
          annotations:
            # From `terraform output lb_controller_role_arn` in Infra Repo.
            eks.amazonaws.com/role-arn: "arn:aws:iam::186189159492:role/financial-ner-llm-lb-controller-role"
        # Set explicitly - IMDS auto-detection failed in practice (default
        # IMDS hop limit is 1, which doesn't survive the extra network hop
        # from inside a pod, so the metadata call times out and the
        # controller can't start). Must match Infra Repo's vpc.tf/variables.tf.
        region: eu-west-1
        # Was vpc-015cc159b0b8f25d9 - went stale after the VPC got
        # recreated (new ID from Terraform), which broke subnet
        # auto-discovery (FailedBuildModel: "Evaluated 0 subnets" - it was
        # filtering DescribeSubnets by a VPC ID that no longer existed).
        # Re-check against `terraform output vpc_id` if this ever recurs.
        vpcId: vpc-00963af74e3904acf
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
