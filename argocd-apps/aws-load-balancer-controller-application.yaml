apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.5.0
    helm:
      values: |
        # Must exactly match the EKS cluster's real name - same gotcha as
        # the kubernetes.io/cluster/* subnet tags in Infra Repo's
        # subnets.tf. The controller uses this to filter which subnets/
        # resources belong to it.
        clusterName: financial-ner-llm
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
          annotations:
            # From `terraform output lb_controller_role_arn` in Infra Repo.
            eks.amazonaws.com/role-arn: "arn:aws:iam::186189159492:role/financial-ner-llm-lb-controller-role"
        # region/vpcId deliberately NOT set here anymore - they used to be
        # hardcoded because IMDS auto-detection failed (default IMDS hop
        # limit of 1 doesn't survive the extra network hop from inside a
        # pod, so the metadata call timed out). That's now fixed at the
        # node level - Infra Repo's node_group.tf gives every node a
        # launch template with http_put_response_hop_limit = 2. The
        # hardcoded vpcId went stale twice this session as the VPC got
        # recreated with a new ID each time; letting the controller
        # auto-detect it removes that failure mode entirely instead of
        # continuing to patch a value that inherently can't stay current.
        # If the controller ever fails to start again with a metadata
        # timeout, re-verify the hop limit fix before reintroducing these.
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
