apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm
  # This is the namespace ArgoCD itself lives in - NOT where the app gets
  # deployed (that's spec.destination.namespace below).
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AthreyaG4/financial-ner-llm-config.git
    targetRevision: main
    path: vllm
  destination:
    server: https://kubernetes.default.svc
    namespace: financial-ner-llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
