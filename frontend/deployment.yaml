apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # NOTE: :latest is only for the very first manual apply, before CI has
          # ever run. Every push after that should have this bumped to the
          # commit-SHA tag by the CI pipeline - never leave this on :latest.
          # Also remember VITE_API_BASE_URL is baked into this image at build
          # time - rebuilding is required if the backend's URL ever changes.
          image: 186189159492.dkr.ecr.eu-west-1.amazonaws.com/financial-ner-llm-frontend:059bdf562253df799ba198bcdc5a89f7fde9eafb
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
